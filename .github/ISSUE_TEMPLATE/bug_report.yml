name: Bug report
description: Create a report to help us improve macMAKE
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce the behavior?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Host Environment
      description: OS version, host architecture, macMAKE release version.
    validations:
      required: true
